[package]
name = "piui"
version = "0.1.0"
description = "A local desktop interface for the Pi coding-agent harness"
authors = ["PIUI contributors"]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[lib]
name = "piui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "piui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
libc = "=0.2.189"
regex = "=1.13.1"
keyring = "=4.1.5"
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.9.0"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSAccessibilityProtocols",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSOpenPanel",
  "NSPasteboard",
  "NSResponder",
  "NSSecureTextField",
  "NSText",
  "NSTextField",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSNotification",
  "NSString",
  "NSURL",
] }
