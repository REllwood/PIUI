[package]
name = "piui"
version = "0.1.0"
description = "A local desktop interface for the Pi coding-agent harness"
authors = ["PIUI contributors"]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[lib]
name = "piui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "piui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
libc = "=0.2.189"
regex = "=1.13.1"
keyring = "=4.1.5"
uuid = { version = "=1.24.0", features = ["v4"] }
zeroize = "=1.9.0"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
